job_name: baseline_e4b_q4km
jobs_dir: results/
n_attempts: 5
n_concurrent_trials: 1

retry:
  max_retries: 2
  exclude_exceptions:
    - AgentTimeoutError
    - VerifierTimeoutError
    - RewardFileEmptyError
    - RewardFileNotFoundError
    - ApiUsageLimitError
    - VerifierOutputParseError

