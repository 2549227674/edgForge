# EdgeForge M0 evaluation contract.
# Populate values only from a recorded run.  A frozen-field change requires a
# Git commit and an updated project.frozen_date.

project:
  milestone: M0
  frozen_date: null
  status: draft  # draft -> frozen

model:
  name: gemma-4-e4b-it
  quantization: Q4_K_M
  path: null
  sha256: null
  source: null  # official_gguf | self_quantized_from_bf16
  imatrix_used: null  # true | false; record imatrix corpus/provenance if true

