agents:
  - name: terminus-2
    model_name: openai/gemma4-e4b
    kwargs:
      api_base: http://localhost:8080/v1
      temperature: 1.0
      max_turns: 30
      parser_name: json
      enable_summarize: false

verifier:
  disable: false
